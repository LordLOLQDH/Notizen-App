<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<meta name="description" content="Offlinefähige Notiz-App">
<link rel="manifest" href="./manifest.json">
<title>Notiz-App</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#eef1f6;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--primary:#4f46e5;--danger:#dc2626;--shadow:0 10px 30px rgba(15,23,42,.08)}
body.dark{--bg:#0b1120;--surface:#111827;--surface2:#1f2937;--text:#f9fafb;--muted:#9ca3af;--border:#374151;--primary:#818cf8;--danger:#f87171;--shadow:0 10px 30px rgba(0,0,0,.25)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;transition:.25s}button,input,textarea{font:inherit}button{cursor:pointer}.app{width:min(1200px,100%);margin:auto;padding:20px 16px 40px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:var(--primary);color:#fff;font-size:23px}h1{margin:0;font-size:1.5rem}.subtitle{margin:4px 0 0;color:var(--muted);font-size:.9rem}.theme-button{width:44px;height:44px;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--text);font-size:19px}.composer{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:20px}.composer h2{margin:0 0 14px;font-size:1.1rem}.field{margin-bottom:12px}input,textarea{width:100%;border:1px solid var(--border);border-radius:12px;background:var(--surface2);color:var(--text);padding:12px 14px;outline:0}input:focus,textarea:focus{border-color:var(--primary)}textarea{min-height:130px;resize:vertical}.composer-actions{display:flex;gap:10px;flex-wrap:wrap}.button{border:0;border-radius:12px;padding:11px 16px;font-weight:700}.button-primary{background:var(--primary);color:#fff}.button-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px}.search{flex:1}.note-count{white-space:nowrap;color:var(--muted);font-size:.9rem}.notes-grid{display:grid;grid-template-columns:1fr;gap:16px}.note-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow);animation:in .3s ease;overflow-wrap:anywhere}.note-card.removing{animation:out .22s ease forwards}.note-title{margin:0 0 8px;font-size:1.1rem}.note-content{margin:0 0 16px;color:var(--muted);white-space:pre-wrap;line-height:1.55}.note-date{margin-bottom:14px;color:var(--muted);font-size:.78rem}.note-actions{display:flex;gap:8px}.note-actions button{flex:1;border:1px solid var(--border);border-radius:10px;padding:9px;background:var(--surface2);color:var(--text);font-weight:600}.note-actions .delete{color:var(--danger)}.empty{text-align:center;padding:50px 20px;color:var(--muted);grid-column:1/-1}.empty-icon{font-size:40px}.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;background:#0009;backdrop-filter:blur(5px)}.modal.open{display:flex}.modal-content{width:min(600px,100%);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px}.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-header h2{margin:0}.close{width:38px;height:38px;border:0;border-radius:50%;background:var(--surface2);color:var(--text);font-size:20px}@keyframes in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}@keyframes out{to{opacity:0;transform:scale(.94)}}@media(min-width:600px){.notes-grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:900px){.notes-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand"><div class="brand-icon">📝</div><div><h1>Notiz-App</h1><p class="subtitle">Lokal. Privat. Offline.</p></div></div><button id="themeToggle" class="theme-button" type="button">🌙</button></header>
<section class="composer"><h2>Neue Notiz</h2><form id="noteForm"><div class="field"><input id="noteTitle" maxlength="120" placeholder="Titel" required></div><div class="field"><textarea id="noteContent" maxlength="10000" placeholder="Was möchtest du dir merken?" required></textarea></div><div class="composer-actions"><button class="button button-primary" type="submit">Notiz speichern</button><button class="button button-secondary" id="clearForm" type="button">Leeren</button></div></form></section>
<section class="toolbar"><input class="search" id="searchInput" type="search" placeholder="Notizen durchsuchen..." aria-label="Notizen durchsuchen"><span class="note-count" id="noteCount">0 Notizen</span></section>
<section id="notesGrid" class="notes-grid" aria-live="polite"></section>
</main>
<div class="modal" id="editModal" role="dialog" aria-modal="true"><div class="modal-content"><div class="modal-header"><h2>Notiz bearbeiten</h2><button class="close" id="closeModal" type="button">×</button></div><form id="editForm"><div class="field"><input id="editTitle" maxlength="120" placeholder="Titel" required></div><div class="field"><textarea id="editContent" maxlength="10000" required></textarea></div><button class="button button-primary" type="submit">Änderungen speichern</button></form></div></div>
<script src="./app.js"></script>
</body>
</html>
